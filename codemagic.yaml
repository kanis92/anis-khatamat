# Codemagic - Configuration ANIS Khatamat
# Documentation: https://docs.codemagic.io/flutter-configuration/yaml

workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 90
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: 16.2
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aniskhatamat.app
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      # Nettoyage Pods uniquement si erreur gRPC (désactivé pour accélérer)
      # - name: Clean iOS Pods
      #   script: cd ios && rm -rf Pods Podfile.lock .symlinks && cd ..
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Flutter build IPA
        script: flutter build ipa
      - name: Export IPA avec SwiftSupport (xcodebuild)
        script: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/ios/iphoneos/*.app
    publishing:
      scripts:
        - name: Build info
          script: |
            echo "Build terminé avec succès"
            flutter --version
