# Codemagic - Configuration ANIS Khatamat
# Documentation: https://docs.codemagic.io/flutter-configuration/yaml

workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Clean iOS Pods (fresh install for gRPC fix)
        script: |
          cd ios && rm -rf Pods Podfile.lock .symlinks && cd ..
      - name: Flutter build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      scripts:
        - name: Build info
          script: |
            echo "Build terminé avec succès"
            flutter --version
