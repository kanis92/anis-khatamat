# Codemagic - ANIS Khatamat
# Méthode professionnelle : xcode-project build-ipa (archive + export natif Xcode)
# → IPA correct avec SwiftSupport, pas d'erreur 90426
#
# Pour publication auto TestFlight : ajouter dans Codemagic UI
# - Integration "Developer Portal" avec clé API App Store Connect
# - Puis décommenter "integrations" et "publishing" ci-dessous

workflows:
  quality-checks:
    name: Quality Gates (analyze, tests, builds)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      node: 18
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze
          if [ $? -ne 0 ]; then
            echo "❌ Flutter analyze failed"
            exit 1
          fi
      - name: Flutter tests
        script: |
          flutter test --no-pub
          if [ $? -ne 0 ]; then
            echo "❌ Flutter tests failed"
            exit 1
          fi
      - name: Firestore rules tests (optional)
        script: |
          if command -v firebase >/dev/null 2>&1; then
            cd test/firestore_rules
            npm install
            npm test
            cd ../..
          else
            echo "⚠️  Firebase CLI not available, skipping Firestore rules tests"
          fi
      - name: Build web (release)
        script: |
          flutter build web --release
          if [ $? -ne 0 ]; then
            echo "❌ Web build failed"
            exit 1
          fi
      - name: Build Android APK (release)
        script: |
          flutter build apk --release
          if [ $? -ne 0 ]; then
            echo "❌ Android build failed"
            exit 1
          fi
    artifacts:
      - build/web/**
      - build/app/outputs/flutter-apk/*.apk
  ios-workflow:
    name: iOS Build
    max_build_duration: 90
    instance_type: mac_mini_m1
    # integrations:
    #   app_store_connect: NOM_DE_VOTRE_INTEGRATION
    environment:
      flutter: stable
      xcode: 26
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aniskhatamat.app
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install && cd ..
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA (release production Firebase + API)
        script: |
          flutter build ipa --release \
            --dart-define=ENV_MODE=production \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - build/ios/archive/*.xcarchive
    publishing:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      scripts:
        - name: Build info
          script: |
            echo "Build terminé avec succès"
            flutter --version
